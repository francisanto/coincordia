version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - NEXT_PUBLIC_CONTRACT_ADDRESS=0xe93ECeA7f56719e60cb03fc1608A5830793D95FF
      - NEXT_PUBLIC_NETWORK=opBNB Testnet
      - NEXT_PUBLIC_RPC_URL=https://opbnb-testnet-rpc.bnbchain.org
      - NEXT_PUBLIC_CHAIN_ID=5611
      - NEXT_PUBLIC_API_URL=http://backend:3002
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - CONTRACT_ADDRESS=0xe93ECeA7f56719e60cb03fc1608A5830793D95FF
      - RPC_URL=https://opbnb-testnet-rpc.bnbchain.org
      - NETWORK=opBNB Testnet
      - CHAIN_ID=5611
      - FRONTEND_URL=http://frontend:5000
      - MONGODB_URI=mongodb://mongodb:27017/coincordia
      - ADMIN_ADDRESS=0xdA13e8F82C83d14E7aa639354054B7f914cA0998
      - ADMIN_API_KEY=80378e51250f63ba0746e03add2019001106874edaf28dd6a529a0ae394a94f1
    depends_on:
      - mongodb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  mongodb_data: